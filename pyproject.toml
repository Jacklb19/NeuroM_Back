[project]
name = "neuromelody-api"
version = "0.1.0"
description = "NeuroMelody API: identity, sessions and language model support."
license = "MIT"
requires-python = ">=3.13"
# Vercel installs these when it builds the function: with a pyproject.toml present it
# reads this list and ignores requirements.txt. Both hold the same pins, transitive
# packages included, and a test fails when they differ.
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "cffi==2.1.1",
    "cryptography==50.0.2",
    "fastapi==0.142.2",
    "h11==0.16.0",
    "httpcore2==2.13.1",
    "httpx2==2.13.1",
    "idna==3.20",
    "opentelemetry-api==1.45.1",
    "pycparser==3.11",
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "PyJWT==2.15.1",
    "starlette==1.7.0",
    "truststore==0.10.4",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the app package however pytest is launched.
pythonpath = ["."]
