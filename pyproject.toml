[project]
name = "neuromelody-api"
version = "0.1.0"
description = "NeuroMelody API: identity, sessions and language model support."
license = "MIT"
requires-python = ">=3.13"
# Vercel installs these when it builds the function: with a pyproject.toml present it
# reads this list and ignores requirements.txt. Both hold the same pins, transitive
# packages included, and a test fails when they differ.
dependencies = [
    "annotated-doc==0.0.7",
    "annotated-types==0.8.0",
    "anyio==4.16.0",
    "cffi==2.1.1",
    "cryptography==50.0.2",
    "fastapi==0.165.0",
    "h11==0.16.0",
    "httpcore2==2.16.2",
    "httpx2==2.16.2",
    "idna==3.20",
    "opentelemetry-api==1.45.2",
    "pycparser==3.12",
    "pydantic==2.14.4",
    "pydantic_core==2.50.5",
    "PyJWT==2.15.1",
    "starlette==1.10.0",
    "truststore==0.10.5",
    "typing-inspection==0.4.5",
    "typing_extensions==4.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the app package however pytest is launched.
pythonpath = ["."]

# Coverage of the API (specification: at least 70 %). CI runs `pytest --cov`;
# below the threshold the run fails.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

# Linter of the API, the tests, the tools and the training job. The rules are
# written here so every machine checks the same, whatever its own settings.
[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["training/cache"]

[tool.ruff.lint]
# Errors and undefined names (E, F), sorted imports (I), likely bugs (B),
# modern syntax (UP), security (S) and Ruff's own checks (RUF).
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.isort]
# The training scripts import one another by module name, as local code.
known-first-party = ["app", "tests", "tools", "collected", "extract", "features", "release", "store", "train", "wesad", "test_collected"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and their fake secrets are not secrets.
"tests/**" = ["S101", "S105", "S106"]
"training/test_*.py" = ["S101", "S105", "S106"]
