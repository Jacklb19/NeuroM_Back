name: Train classifier

# Retrains the activation classifier with the guided recordings people sent
# (ADR-32, ADR-33). It never publishes by itself: the "publish" job waits for
# a person to approve it in the "model-release" environment, and only runs
# when the new model did at least as well as the current one.
#
# It runs on a schedule or by hand, never on a pull request, so the service
# role key is not within reach of code somebody else proposed.

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: train-classifier
  cancel-in-progress: false

jobs:
  train:
    name: Train and evaluate
    runs-on: ubuntu-latest
    outputs:
      passes: ${{ steps.decision.outputs.passes }}
    defaults:
      run:
        working-directory: training
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: training/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Download the heartbeat cache and the recordings
        run: python store.py fetch recordings.json
      - name: Train with the recordings
        run: python train.py candidate.json --collected recordings.json
      - name: Decide whether it may be released
        id: decision
        run: |
          python release.py summary candidate.json >> "$GITHUB_STEP_SUMMARY"
          echo "passes=$(python release.py passes candidate.json)" >> "$GITHUB_OUTPUT"
      # Only the model: the recordings never leave the job.
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: training/candidate.json
          retention-days: 30

  publish:
    name: Publish (needs approval)
    needs: train
    if: needs.train.outputs.passes == 'true'
    runs-on: ubuntu-latest
    # A required reviewer on this environment is the click that publishes.
    environment: model-release
    defaults:
      run:
        working-directory: training
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-model
          path: training
      - run: python release.py publish candidate.json
